<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Shadow</title>
    <style>
        body {
          
          font-family: sans-serif; 
        }
        div{
            height: 200px;
            text-align: center;
             background: linear-gradient(to bottom right ,rgb(239, 220, 185),rgb(231, 180, 79)); 
            color: rgb(255,255,255);
            text-shadow: 1px 1px 3px rgb(0,0,0,0.2);
            letter-spacing: 1px;
            border-radius: 5px;
            box-shadow: 0px,4px,10px rgba(0, 0, 0, 0.1);
        }
        h2{
            background: radial-gradient(circle,white,rgb(117, 117, 231));
            border-radius: 5px;
        }
        button {
            text-transform: uppercase;
        }
        p {
            background: linear-gradient(pink,purple);
            -webkit-background-clip: text;
            color: transparent;
            line-height: 1.6;
            letter-spacing:1px;
        }
        img{
            width: 200px;
            border: 2px solid black;
            border-radius: 10px;
            filter: brightness(100%);
            object-fit: cover;

        }
    </style>
</head>
<body>
    <img src="C:\Users\hp\Downloads\portfolio5.jpeg" alt="photo">
    <div>
        <h1>Gradient</h1>
    </div>
    <h2>Welcom <br>to<br> My Website</h2>
    <p>This is CSS<br>This is HTML</p>
    <button type="button">Contact Us</button>
</body>
</html>
